<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Bonum — A personal collection of wisdom on morality, virtue, and becoming a good person. Your daily companion for self-development.">
  <title>Bonum — Wisdom & Virtue Journal</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>">
</head>
<body>

  <!-- Animated Background -->
  <div class="app-background"></div>

  <!-- App Container -->
  <div class="app-container">

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-back" id="nav-back" onclick="goBack()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <div class="nav-title" id="nav-title">Bonum</div>
        <div class="nav-actions">
          <button class="nav-action-btn" onclick="openSearch()" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="view active" id="main-content">
      <!-- Dynamically rendered -->
    </main>

  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-item active" data-tab="home" onclick="handleTab('home')">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="tab-item" data-tab="meditatio" onclick="handleTab('meditatio')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <span>Meditatio</span>
      </button>
      <button class="tab-item" data-tab="add" onclick="handleTab('add')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Add</span>
      </button>
      <button class="tab-item" data-tab="search" onclick="handleTab('search')">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
    </div>
  </div>

  <!-- Meditatio Overlay -->
  <div class="meditatio-view" id="meditatio-overlay">
    <div class="meditatio-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <button class="meditatio-close" onclick="closeMeditatio()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="meditatio-content">
      <span class="meditatio-lotus">🪷</span>
      <div class="meditatio-quote" id="meditatio-quote"></div>
      <div class="meditatio-source" id="meditatio-source"></div>
      <div class="meditatio-controls">
        <button class="meditatio-btn secondary" onclick="prevMeditatio()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="meditatio-btn primary" onclick="nextMeditatio()">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
    <div class="meditatio-progress" id="meditatio-dots"></div>
  </div>

  <!-- Add Entry Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Add Wisdom</div>
      
      <div class="form-group">
        <label class="form-label" for="entry-pillar-select">Pillar</label>
        <select class="form-select" id="entry-pillar-select">
          <option value="relatio">🧡 Relatio — Relationships</option>
          <option value="habitus">🪄 Habitus — Habits</option>
          <option value="bonus-affectus">🌈 Bonus Affectus — Good Emotions</option>
          <option value="malus-affectus">💢 Malus Affectus — Negative Emotions</option>
          <option value="ingenia">🤾 Ingenia et Virtutes — Virtues</option>
          <option value="philosophorum">🤔 Philosophorum — Philosophy</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="entry-title-input">Title</label>
        <input type="text" class="form-input" id="entry-title-input" placeholder="A short title for this wisdom…">
      </div>

      <div class="form-group">
        <label class="form-label" for="entry-body-input">Content</label>
        <textarea class="form-textarea" id="entry-body-input" placeholder="Write your reflection, insight, or wisdom…"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
